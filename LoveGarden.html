<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Cookie&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --pink:#ff3fa2;
      --pink2:#ff6ab7;
      --card:rgba(255,255,255,.82);
      --shadow:0 12px 30px rgba(0,0,0,.14);
      --green1:#98ec8d;
      --green2:#46b14c;
      --sky1:#95d7eb;
      --sky2:#91eb8e;
      --night1:#2c2387;
      --night2:#145a20;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;font-family:'Quicksand',system-ui,sans-serif;background:#9cd}
    body.day{background:linear-gradient(to bottom,var(--sky1) 0%, var(--sky2) 58%, #2de819 100%)}
    body.night{background:linear-gradient(to bottom,var(--night1) 0%, #4a458f 48%, var(--night2) 100%)}
    #app{position:relative;width:100vw;height:100vh;overflow:hidden}

    .title{
      position:absolute;top:28px;left:50%;transform:translateX(-50%);
      font-family:'Pacifico',cursive;font-size:clamp(36px,3.4vw,62px);
      color:#ff2da1; text-shadow:0 0 12px rgba(255,67,175,.55), 0 3px 0 rgba(255,255,255,.25);
      z-index:30; user-select:none; white-space:nowrap;
    }

    .stats{
      position:absolute;top:22px;left:22px;z-index:30;
      min-width:280px; padding:16px 18px;border-radius:20px;
      background:rgba(255,255,255,.82);box-shadow:var(--shadow);font-size:19px;line-height:1.35;
      font-weight:700;color:#111
    }

    .toggle{
      position:absolute;top:22px;right:22px;z-index:35;width:58px;height:58px;border:none;border-radius:50%;
      background:rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:28px;cursor:pointer
    }

    .sun,.moon{
      position:absolute;right:120px;top:84px;width:64px;height:64px;border-radius:50%;z-index:8;
      transition:.35s ease;
    }
    .sun{background:#ffd400;box-shadow:0 0 28px rgba(255,212,0,.7), 0 0 60px rgba(255,212,0,.25)}
    .moon{background:#d9cf8d;box-shadow:0 0 28px rgba(255,245,170,.45)}
    body.day .moon{opacity:0;transform:scale(.7)}
    body.day .sun{opacity:1}
    body.night .sun{opacity:0;transform:scale(.75)}
    body.night .moon{opacity:1}

    .ground{position:absolute;left:0;right:0;bottom:0;height:62px;background:#27e813;z-index:5}
    .grass{
      position:absolute;left:0;right:0;bottom:0;height:62px;z-index:6;opacity:.95;
      background:repeating-linear-gradient(90deg, rgba(8,130,20,.34) 0 2px, transparent 2px 5px);
      mask:linear-gradient(to top, #000 10%, transparent 100%);
      -webkit-mask:linear-gradient(to top,#000 10%,transparent 100%);
    }

    .hint{
      position:absolute;left:50%;bottom:32px;transform:translateX(-50%);z-index:40;
      background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
      color:#ff2f98;font-size:20px;font-weight:700;padding:18px 28px;border-radius:999px;
      box-shadow:0 8px 24px rgba(0,0,0,.12); min-width:min(760px,80vw); text-align:center;
    }

    .cloud{position:absolute;background:rgba(255,255,255,.38);border-radius:999px;filter:blur(.2px);z-index:3}
    .cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:inherit}
    .cloud::before{width:46%;height:70%;left:10%;top:-20%}
    .cloud::after{width:38%;height:60%;right:12%;top:-15%}

    #sparkles, #flowers, #messages, #bugs{position:absolute; inset:0}
    #sparkles{z-index:2; pointer-events:none}
    #flowers{z-index:12}
    #messages{z-index:20; pointer-events:none}
    #bugs{z-index:18; pointer-events:none}

    .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd119;opacity:.85;animation:twinkle 2.8s infinite ease-in-out}
    body.night .dot{background:#ffe84c}
    @keyframes twinkle{50%{opacity:.25;transform:scale(.6)} }

    .flower{position:absolute;bottom:62px;transform:translateX(-50%);animation:grow .55s ease-out both}
    @keyframes grow{from{transform:translateX(-50%) scale(.15);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
    .stem{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:4px;border-radius:6px;background:linear-gradient(to bottom,#7dff7f,#22b62b)}
    .bloom{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%}
    .petal{position:absolute;left:50%;top:50%;transform-origin:center -28px;border-radius:50% 50% 55% 55%;}
    .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ffd137}

    .message{position:absolute;padding:16px 28px; max-width:430px; min-width:300px; text-align:center;
      border-radius:26px; background:rgba(255,255,255,.72); border:4px solid rgba(255,130,170,.45);
      box-shadow:0 8px 30px rgba(255,92,170,.18), 0 0 40px rgba(180,255,160,.28);
      font-family:'Cookie',cursive;font-size:28px;color:#4d4d4d;line-height:1.1;animation:floatIn .6s ease both;
    }
    .message.banner{background:linear-gradient(90deg,#f76eb4,#f28ac4); color:#fff; border:none; font-family:'Pacifico',cursive; font-size:28px; box-shadow:0 12px 34px rgba(255,92,170,.38)}
    @keyframes floatIn{from{opacity:0; transform:translateY(14px) scale(.95)} to{opacity:1; transform:translateY(0) scale(1)}}

    .burst{position:absolute;font-size:26px;pointer-events:none;animation:burst 1.1s ease forwards}
    @keyframes burst{0%{opacity:0;transform:translate(-50%,-10px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-70px + var(--dy))) scale(1.15)}}

    .bug{position:absolute;font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));animation:fly linear infinite}
    @keyframes fly{from{transform:translateX(-8vw) translateY(0)}to{transform:translateX(108vw) translateY(-8px)}}

    .cursor-heart{position:absolute;font-size:26px;pointer-events:none;z-index:24;animation:pop 1s ease forwards}
    @keyframes pop{0%{opacity:0;transform:translate(-50%,-10%) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}

    @media (max-width: 900px){
      .stats{min-width:220px;font-size:16px;padding:12px 14px}
      .hint{min-width:unset;width:90vw;font-size:16px;padding:14px 18px;bottom:18px}
      .message{min-width:220px;max-width:76vw;font-size:22px}
      .message.banner{font-size:22px}
      .title{top:20px}
      .sun,.moon{right:88px;top:98px;width:56px;height:56px}
    }
  </style>
</head>
<body class="day">
  <div id="app">
    <div class="stats" id="stats">
      🌸 Flowers: <span id="flowerCount">0</span><br>
      💝 Love Messages: <span id="messageCount">0</span><br>
      🦋 Garden Level: <span id="gardenLevel">Seedling</span>
    </div>

    <div class="title">Love Garden 🌸</div>
    <button class="toggle" id="toggleBtn" aria-label="Toggle day night">🌙</button>
    <div class="sun"></div>
    <div class="moon"></div>

    <div class="cloud" style="left:8%;top:176px;width:80px;height:42px"></div>
    <div class="cloud" style="left:56%;top:250px;width:82px;height:48px"></div>
    <div class="cloud" style="left:18%;top:390px;width:102px;height:60px"></div>
    <div class="cloud" style="left:77%;top:416px;width:88px;height:52px"></div>
    <div class="cloud" style="right:6%;top:116px;width:72px;height:42px"></div>

    <div id="sparkles"></div>
    <div id="flowers"></div>
    <div id="messages"></div>
    <div id="bugs"></div>

    <div class="ground"></div>
    <div class="grass"></div>
    <div class="hint">Click anywhere to grow flowers! Love messages appear every few blooms 💕</div>
  </div>

  <script>
    const app = document.getElementById('app');
    const flowersEl = document.getElementById('flowers');
    const messagesEl = document.getElementById('messages');
    const sparklesEl = document.getElementById('sparkles');
    const bugsEl = document.getElementById('bugs');
    const flowerCountEl = document.getElementById('flowerCount');
    const messageCountEl = document.getElementById('messageCount');
    const gardenLevelEl = document.getElementById('gardenLevel');
    const toggleBtn = document.getElementById('toggleBtn');

    let flowerCount = 0;
    let messageCount = 0;
    let day = true;

    const levels = [
      [0,'Seedling'],
      [8,'Budding Beauty'],
      [18,'Blooming Bliss'],
      [30,'Flourishing Garden'],
      [45,'Enchanted Eden'],
      [65,'Forever in Bloom']
    ];

    const messages = [
      'Welcome to our love garden! 🌸',
      'Our love is blooming! 💐',
      'You are the reason I can relax even in stress',
      'You are the reason now I am calm minded just like ocean breeze',
      'You are the sun in my life; my heart like a blooming flower',
      'You\'ve created a garden of love! 💐',
      'You are the reason for the smile on my face like a bright sky',
      'Every bloom here feels like your kindness',
      'Your love makes ordinary days feel magical ✨',
      'In this garden, every flower whispers your name',
      'You make my heart blossom again and again 🌷',
      'Even silence feels soft when I think of you'
    ];

    const bannerMessages = new Set([0,1,5]);
    const petalPalettes = [
      ['#ffffff','#ffd43a'],
      ['#ff4ea4','#ffd43a'],
      ['#ff9a87','#ffd43a'],
      ['#ffbf00','#f3cc27'],
      ['#b47af1','#ffd43a'],
      ['#ff6f9c','#ffd43a']
    ];

    function rand(min,max){ return Math.random()*(max-min)+min; }
    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    function setLevel(){
      let txt = levels[0][1];
      for(const [n,t] of levels) if(flowerCount >= n) txt = t;
      gardenLevelEl.textContent = txt;
    }

    function addSparkles(n=40){
      sparklesEl.innerHTML='';
      for(let i=0;i<n;i++){
        const d=document.createElement('div');
        d.className='dot';
        d.style.left=rand(0,100)+'vw';
        d.style.top=rand(3,86)+'vh';
        d.style.animationDelay=rand(0,2.8)+'s';
        d.style.opacity=rand(.3,.95);
        const s=rand(2,5);
        d.style.width=d.style.height=s+'px';
        sparklesEl.appendChild(d);
      }
    }

    function createFlower(x,y){
      const wrap=document.createElement('div');
      wrap.className='flower';
      wrap.style.left = x+'px';
      const stemH = rand(120, 320);
      const size = rand(28, 62);
      const [petalColor, centerColor] = pick(petalPalettes);

      const stem=document.createElement('div');
      stem.className='stem';
      stem.style.height = stemH+'px';
      wrap.appendChild(stem);

      const bloom=document.createElement('div');
      bloom.className='bloom';
      bloom.style.width=bloom.style.height=size+'px';
      bloom.style.bottom=(stemH-8)+'px';

      const petalCount = size > 48 ? 8 : 6;
      for(let i=0;i<petalCount;i++){
        const p=document.createElement('div');
        p.className='petal';
        const pw=size*.34, ph=size*.54;
        p.style.width=pw+'px'; p.style.height=ph+'px';
        p.style.background=petalColor;
        p.style.transform = `translate(-50%,-50%) rotate(${(360/petalCount)*i}deg) translateY(-${size*.34}px)`;
        bloom.appendChild(p);
      }
      const center=document.createElement('div');
      center.className='center';
      center.style.width=center.style.height=(size*.28)+'px';
      center.style.background=centerColor;
      bloom.appendChild(center);
      wrap.appendChild(bloom);

      if(Math.random()>.55){
        const leaf1=document.createElement('div');
        leaf1.style.cssText=`position:absolute;left:calc(50% - 12px);bottom:${rand(30,stemH-30)}px;width:18px;height:10px;background:#46c34a;border-radius:100% 0 100% 0;transform:rotate(-28deg);opacity:.8`;
        const leaf2=document.createElement('div');
        leaf2.style.cssText=`position:absolute;left:50%;bottom:${rand(40,stemH-20)}px;width:18px;height:10px;background:#46c34a;border-radius:0 100% 0 100%;transform:rotate(20deg);opacity:.8`;
        wrap.appendChild(leaf1);wrap.appendChild(leaf2);
      }

      flowersEl.appendChild(wrap);
      return wrap;
    }

    function addBurst(x,y){
      const icons=['🌸','💕','✨','🌷'];
      for(let i=0;i<6;i++){
        const b=document.createElement('div');
        b.className='burst';
        b.textContent=pick(icons);
        b.style.left=x+'px'; b.style.top=y+'px';
        b.style.setProperty('--dx', rand(-60,60)+'px');
        b.style.setProperty('--dy', rand(-30,20)+'px');
        b.style.animationDelay=(i*0.03)+'s';
        messagesEl.appendChild(b);
        setTimeout(()=>b.remove(),1100);
      }
    }

    function showMessage(x,y){
      const idx = messageCount % messages.length;
      const m=document.createElement('div');
      const isBanner = bannerMessages.has(idx);
      m.className='message'+(isBanner?' banner':'');
      m.textContent = messages[idx];
      const w = Math.min(window.innerWidth-60, isBanner ? 430 : 390);
      m.style.left = Math.max(20, Math.min(window.innerWidth-w-20, x - w/2)) + 'px';
      m.style.top = Math.max(120, y - rand(140,220)) + 'px';
      messagesEl.appendChild(m);
      setTimeout(()=>m.remove(), 9000);
      messageCount++;
      messageCountEl.textContent = messageCount;
    }

    function placeInitial(){
      const presets = [
        [0.48,0.78],[0.70,0.80],[0.73,0.75],[0.20,0.76],[0.24,0.80],[0.28,0.82],
        [0.53,0.74],[0.36,0.76],[0.30,0.88],[0.74,0.90],[0.18,0.90],[0.86,0.88]
      ];
      presets.forEach(([px,py],i)=>{
        const x=window.innerWidth*px;
        const y=window.innerHeight*py;
        createFlower(x,y);
        flowerCount++;
      });
      flowerCountEl.textContent = flowerCount;
      setLevel();
      ['Welcome to our love garden! 🌸','Our love is blooming! 💐'].forEach((t,idx)=>{
        const m=document.createElement('div');
        m.className='message'+(idx===1?' banner':'');
        m.textContent=t;
        m.style.left=(window.innerWidth*(idx?0.52:0.42))+'px';
        m.style.top=(window.innerHeight*(idx?0.53:0.44))+'px';
        messagesEl.appendChild(m);
        setTimeout(()=>m.remove(), 8000);
      });
      messageCount=2; messageCountEl.textContent=2;
    }

    function onGrow(e){
      if(e.target.id==='toggleBtn') return;
      const x=e.clientX, y=e.clientY;
      createFlower(x,y);
      const heart=document.createElement('div');
      heart.className='cursor-heart'; heart.textContent='💞';
      heart.style.left=x+'px'; heart.style.top=y+'px';
      messagesEl.appendChild(heart); setTimeout(()=>heart.remove(),1000);
      addBurst(x,y);
      flowerCount++; flowerCountEl.textContent = flowerCount; setLevel();
      if(flowerCount % 4 === 0) showMessage(x,y);
    }

    function spawnBug(icon, top, dur){
      const b=document.createElement('div');
      b.className='bug'; b.textContent=icon;
      b.style.top=top+'vh'; b.style.animationDuration=dur+'s'; b.style.animationDelay=rand(0,1)+'s';
      bugsEl.appendChild(b);
      setTimeout(()=>b.remove(), dur*1000+1500);
    }
    function bugLoop(){
      spawnBug(Math.random()>.5?'🐝':'🦋', rand(18,86), rand(12,22));
      setTimeout(bugLoop, rand(2800,5200));
    }

    toggleBtn.addEventListener('click', ()=>{
      day=!day;
      document.body.classList.toggle('day', day);
      document.body.classList.toggle('night', !day);
      toggleBtn.textContent = day ? '🌙' : '☀️';
      addSparkles(day?42:55);
    });

    app.addEventListener('click', onGrow);
    window.addEventListener('resize', ()=> addSparkles(document.body.classList.contains('day')?42:55));

    document.body.classList.add('day');
    addSparkles(42);
    placeInitial();
    bugLoop();
  </script>
</body>
</html>
